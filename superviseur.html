<!DOCTYPE html>
<html lang="fr" dir="ltr" id="doc-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Superviseur - ثانوية شعبان أعمر أوقاس</title>
  
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
    button, select, input { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    button:active { transform: scale(0.96); }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-table-row { animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes shakeBox {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-error {
      animation: shakeBox 0.35s ease-in-out;
      border-color: #f43f5e !important;
      box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.2) !important;
    }

    @keyframes alertPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .badge-alerte-rouge { animation: alertPulse 1.4s infinite ease-in-out; }

    @media print {
      body * { visibility: hidden; }
      body.print-billet #zone-impression-billet, 
      body.print-billet #zone-impression-billet * { visibility: visible; }
      body.print-billet #zone-impression-billet { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }

      body.print-convocation #zone-impression-convocation, 
      body.print-convocation #zone-impression-convocation * { visibility: visible; }
      body.print-convocation #zone-impression-convocation { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }

      body.print-rapport #zone-impression-rapport, 
      body.print-rapport #zone-impression-rapport * { visibility: visible; }
      body.print-rapport #zone-impression-rapport { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }

      @page { size: A4 portrait; margin: 15mm; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- Modal Modifier Pointage -->
  <div id="modal-modifier" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
          <span>Modifier l'enregistrement / تعديل الحالة</span>
        </h3>
        <button onclick="fermerModalModifier()" class="text-slate-400 hover:text-slate-600 p-1 cursor-pointer">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <input type="hidden" id="edit-pointage-id" />

      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">Élève / التلميذ(ة)</label>
          <div id="edit-eleve-nom" class="font-bold text-slate-800 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200"></div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">Statut de présence / الحالة</label>
          <select id="edit-statut" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="P">✅ Présent / حاضر (Annuler l'absence)</option>
            <option value="A">❌ Absent / غائب</option>
            <option value="R">⏳ Retard / متأخر</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-500 mb-1">Justification / التبرير</label>
          <div class="flex items-center gap-4 mb-2">
            <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs font-bold text-slate-700">
              <input type="radio" name="edit-justifie" value="non" id="edit-justifie-non" checked class="text-indigo-600 focus:ring-indigo-500" />
              <span>Non justifié / غير مبرر</span>
            </label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs font-bold text-emerald-700">
              <input type="radio" name="edit-justifie" value="oui" id="edit-justifie-oui" class="text-emerald-600 focus:ring-emerald-500" />
              <span>Justifié / مبرر</span>
            </label>
          </div>
          <input type="text" id="edit-motif" placeholder="Motif (ex: Certificat médical, Billet...)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
      </div>

      <div class="flex items-center justify-end gap-2 mt-6 pt-3 border-t border-slate-100">
        <button type="button" onclick="fermerModalModifier()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 cursor-pointer">
          Annuler
        </button>
        <button type="button" onclick="enregistrerModificationPointage()" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md shadow-indigo-600/20 cursor-pointer">
          Enregistrer / حفظ
        </button>
      </div>
    </div>
  </div>

  <!-- Écran PIN Sécurisé (Code non visible en clair, 100% autonome) -->
  <div id="pin-screen" style="position: fixed; inset: 0; z-index: 9999; background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div id="pin-card" class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl text-center border border-slate-100">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-xl font-extrabold text-slate-900">Espace Sécurisé</h2>
      <p class="text-xs text-slate-500 mt-1 mb-6">ثانوية شعبان أعمر - يرجى إدخال الرمز السري</p>
      
      <div class="space-y-4">
        <div>
          <input type="password" id="input-pin" maxlength="4" placeholder="••••" autocomplete="off" inputmode="numeric" autofocus
            class="w-full text-center text-3xl tracking-[0.5em] font-mono py-3 px-4 bg-slate-50 border-2 border-slate-300 rounded-2xl focus:border-indigo-600 focus:bg-white outline-none transition" />
          <p id="pin-error" class="hidden text-xs text-rose-500 font-bold mt-2">Code incorrect / رمز غير صحيح</p>
        </div>
        <button id="btn-valider-pin" type="button" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-600/25 transition cursor-pointer">
          Déverrouiller / الدخول
        </button>
      </div>
      <p class="text-[11px] text-slate-400 mt-5">Accès réservé au Conseiller d'Éducation et à l'Administration</p>
    </div>
  </div>

  <header class="bg-slate-
