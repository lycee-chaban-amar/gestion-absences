  <script>
    // ========================================================
    // SÉCURITÉ INFAILLIBLE : ENCODAGE BASE64 ("MjYyNg==" => "2626")
    // ========================================================
    const PIN_MASQUE = "MjYyNg==";

    // Fonction pour convertir les chiffres arabes (٠١٢٣...) en chiffres latins (0123...)
    function normaliserChiffres(str) {
      const arabicDigits = "٠١٢٣٤٥٦٧٨٩";
      return str.replace(/[٠-٩]/g, function(d) {
        return arabicDigits.indexOf(d);
      });
    }

    function debloquerPage() {
      const pinScreen = document.getElementById('pin-screen-prof');
      if (pinScreen) pinScreen.remove(); // Supprime totalement l'écran
      try {
        sessionStorage.setItem('prof_auth', 'true');
      } catch(e) {
        console.warn("sessionStorage inaccessible (mode navigation privée ou fichier local).");
      }
      initClasses();
    }

    function validerPinDirect() {
      const input = document.getElementById('input-pin-prof');
      const err = document.getElementById('pin-prof-error');
      const card = document.getElementById('pin-card-prof');
      
      let val = input ? input.value.trim() : '';
      val = normaliserChiffres(val); // Convertit ٢٦٢٦ en 2626
      
      if (val.length < 4) return;
      
      if (val === atob(PIN_MASQUE)) {
        if (err) err.classList.add('hidden');
        debloquerPage();
      } else {
        if (err) err.classList.remove('hidden');
        if (card) { 
          card.classList.remove('shake-error'); 
          void card.offsetWidth; 
          card.classList.add('shake-error'); 
        }
        if (input) { 
          input.value = ''; 
          input.focus(); 
        }
      }
    }

    // Écouteurs de clavier / clics
    const inputPin = document.getElementById('input-pin-prof');
    const btnPin = document.getElementById('btn-valider-pin-prof');
    
    if (btnPin) btnPin.onclick = validerPinDirect;
    if (inputPin) {
      inputPin.oninput = function() { 
        let val = normaliserChiffres(this.value.trim());
        if (val.length === 4) validerPinDirect(); 
      };
      inputPin.onkeydown = function(e) { 
        if (e.key === 'Enter') { 
          e.preventDefault(); 
          validerPinDirect(); 
        } 
      };
    }

    // Garder la session active si déjà connecté
    try {
      if (sessionStorage.getItem('prof_auth') === 'true') { 
        debloquerPage(); 
      }
    } catch(e) {
      console.warn("sessionStorage bloqué par le navigateur.");
    }

    // Bouton de verrouillage en haut à droite
    const btnLock = document.getElementById('btn-lock-prof');
    if (btnLock) {
      btnLock.onclick = function() { 
        try { sessionStorage.removeItem('prof_auth'); } catch(e) {}
        location.reload(); 
      };
    }

    // ========================================================
    // SUPABASE & LOGIQUE MÉTIER
    // ========================================================
    const SUPABASE_URL = 'https://eixdnxponkbsmelircjm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__9tG8Pj4aZ14hJxh5b-vug_DmTQb7ww';
    
    let supabaseClient;
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) {
      console.error("Erreur d'initialisation de Supabase. Vérifiez votre connexion internet.", e);
    }

    let classesList = [], currentEleves = [], currentStatuts = {};
    const selectClasse = document.getElementById('select-classe'), selectMatiere = document.getElementById('select-matiere'), selectHoraire = document.getElementById('select-horaire'), elevesContainer = document.getElementById('eleves-container');

    function afficherToast(titre, msg) {
      const t = document.getElementById('toast-notification');
      document.getElementById('toast-titre').textContent = titre; 
      document.getElementById('toast-message').textContent = msg;
      t.classList.remove('-translate-y-24', 'opacity-0'); 
      t.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => { 
        t.classList.add('-translate-y-24', 'opacity-0'); 
        t.classList.remove('translate-y-0', 'opacity-100'); 
      }, 3500);
    }

    async function initClasses() {
      if (!supabaseClient) return; // Sécurité si Supabase n'est pas chargé
      try {
        const { data } = await supabaseClient.from('classes').select('id, nom_court, nom_complet').order('nom_court');
        classesList = data || [];
        if(!selectClasse) return;
        selectClasse.innerHTML = '<option value="">-- Choisir la division / اختر الفوج --</option>';
        const groupes = { '1AS': document.createElement('optgroup'), '2AS': document.createElement('optgroup'), '3AS': document.createElement('optgroup'), 'AUTRE': document.createElement('optgroup') };
        groupes['1AS'].label = "1ère Année"; groupes['2AS'].label = "2ème Année"; groupes['3AS'].label = "3ème Année (Bac)"; groupes['AUTRE'].label = "Autres";
        classesList.forEach(cls => {
          const o = document.createElement('option'); o.value = cls.id; o.textContent = `${cls.nom_court} — ${cls.nom_complet}`;
          if(cls.nom_court.startsWith('1AS')) groupes['1AS'].appendChild(o);
          else if(cls.nom_court.startsWith('2AS')) groupes['2AS'].appendChild(o);
          else if(cls.nom_court.startsWith('3AS')) groupes['3AS'].appendChild(o);
          else groupes['AUTRE'].appendChild(o);
        });
        ['1AS','2AS','3AS','AUTRE'].forEach(k => { if(groupes[k].children.length) selectClasse.appendChild(groupes[k]); });
      } catch (err) { console.log(err); }
    }

    async function chargerEleves(cid) {
      if(!supabaseClient) return;
      if(!cid) {
        elevesContainer.innerHTML = `<div class="py-12 text-center text-slate-400"><p>Veuillez choisir une division</p></div>`;
        document.getElementById('stats-bar').classList.add('hidden'); document.getElementById('actions-footer').classList.add('hidden'); document.getElementById('btn-tout-present').classList.add('hidden');
        return;
      }
      elevesContainer.innerHTML = `<div class="py-12 text-center text-indigo-600"><i class="fa-solid fa-circle-notch fa-spin text-3xl"></i></div>`;
      const sc = classesList.find(c => c.id == cid);
      document.getElementById('classe-titre').textContent = sc ? `${sc.nom_court}` : 'Classe';
      const { data } = await supabaseClient.from('eleves').select('*').eq('classe_id', cid).eq('actif', true).order('nom');
      currentEleves = data || [];
      document.getElementById('classe-effectif').textContent = `${currentEleves.length} inscrits`;
      currentStatuts = {}; currentEleves.forEach(e => currentStatuts[e.id] = 'P');
      afficherEleves();
      mettreAJourCompteurs();
      document.getElementById('stats-bar').classList.remove('hidden'); document.getElementById('actions-footer').classList.remove('hidden'); document.getElementById('btn-tout-present').classList.remove('hidden');
    }

    function afficherEleves() {
      elevesContainer.innerHTML = '';
      currentEleves.forEach((e, i) => {
        const row = document.createElement('div');
        const st = currentStatuts[e.id] || 'P';
        row.className = `animate-row px-4 py-3 sm:py-3.5 flex flex-col sm:flex-row justify-between items-center gap-3 border-b border-slate-100 ${i%2===0?'bg-white':'bg-slate-50'}`;
        row.style.animationDelay = `${Math.min(i*25,400)}ms`;
        row.innerHTML = `
          <div class="flex items-center gap-3.5 w-full sm:w-auto"><span class="w-7 h-7 flex-shrink-0 flex items-center justify-center rounded-full bg-slate-200 text-xs font-bold">${i+1}</span>
          <div class="truncate"><span class="font-bold text-slate-900">${e.nom} ${e.prenom}</span> <span class="text-xs text-slate-500 font-bold" dir="rtl">(${e.nom_ar||''} ${e.prenom_ar||''})</span></div></div>
          <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end">
            <button onclick="changerStatut(${e.id}, 'P')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${st==='P'?'bg-emerald-600 text-white shadow-md':'bg-slate-100 text-slate-600 hover:bg-emerald-50 hover:text-emerald-700'}"><i class="fa-solid fa-check"></i></button>
            <button onclick="changerStatut(${e.id}, 'A')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${st==='A'?'bg-rose-600 text-white shadow-md':'bg-slate-100 text-slate-600 hover:bg-rose-50 hover:text-rose-700'}"><i class="fa-solid fa-xmark"></i></button>
            <button onclick="changerStatut(${e.id}, 'R')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${st==='R'?'bg-amber-500 text-white shadow-md':'bg-slate-100 text-slate-600 hover:bg-amber-50 hover:text-amber-700'}"><i class="fa-solid fa-clock"></i></button>
          </div>
        `;
        elevesContainer.appendChild(row);
      });
    }

    window.changerStatut = function(id, st) { currentStatuts[id] = st; afficherEleves(); mettreAJourCompteurs(); };
    
    if(document.getElementById('btn-tout-present')) {
      document.getElementById('btn-tout-present').onclick = function(){ 
        currentEleves.forEach(e=>currentStatuts[e.id]='P'); 
        afficherEleves(); 
        mettreAJourCompteurs(); 
      };
    }

    function mettreAJourCompteurs() {
      let p=0,a=0,r=0; Object.values(currentStatuts).forEach(s=>{if(s==='P')p++;else if(s==='A')a++;else r++;});
      document.getElementById('count-presents').textContent=p; 
      document.getElementById('count-absents').textContent=a; 
      document.getElementById('count-retards').textContent=r;
    }

    if(document.getElementById('btn-valider-appel')) {
      document.getElementById('btn-valider-appel').onclick = async function() {
        if(!supabaseClient) return afficherToast('Erreur', 'Connexion à la base de données impossible');
        if(!selectClasse.value || currentEleves.length===0) return afficherToast('Erreur', 'Sélectionnez une classe');
        this.disabled=true; this.innerHTML=`<i class="fa-solid fa-spinner fa-spin"></i> Transmission...`;
        try {
          const t = selectHoraire.value.split('-');
          const { data:s, error:e1 } = await supabaseClient.from('seances').insert({ 
            classe_id:selectClasse.value, 
            matiere:selectMatiere.value, 
            date_cours:new Date().toISOString().split('T')[0], 
            heure_debut:t[0]+':00', 
            heure_fin:t[1]+':00', 
            appel_valide:true 
          }).select().single();
          
          if(e1) throw e1;
          
          const pts = currentEleves.map(e=>({ seance_id:s.id, eleve_id:e.id, statut:currentStatuts[e.id]||'P' }));
          const { error:e2 } = await supabaseClient.from('pointages').insert(pts);
          if(e2) throw e2;
          
          afficherToast('Succès', 'Appel transmis avec succès !');
        } catch(e) { 
          afficherToast('Erreur', e.message); 
        } finally { 
          this.disabled=false; 
          this.innerHTML=`<i class="fa-solid fa-paper-plane"></i> Valider et transmettre l'appel`; 
        }
      };
    }
    
    if(selectClasse) selectClasse.onchange = (e) => chargerEleves(e.target.value);
  </script>
