<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feuille d'Appel - ثانوية شعبان أعمر أوقاس</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- En-tête / Header -->
  <header class="bg-indigo-700 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-graduation-cap text-2xl text-amber-400"></i>
        <div>
          <h1 class="text-xl font-bold tracking-tight">Feuille d'Appel Numérique</h1>
          <p class="text-xs text-indigo-200">ثانوية شعبان أعمر أوقاس - تسجيل الحضور والغياب</p>
        </div>
      </div>
      <div id="conn-badge" class="flex items-center gap-2 bg-indigo-800/80 px-3 py-1.5 rounded-full text-xs font-medium">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="conn-text">Connecté à Supabase</span>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- Carte de Sélection : Classe, Matière & Créneau -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-indigo-600"></i> Paramètres du Cours
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Choix de la Classe -->
        <div>
          <label for="select-classe" class="block text-sm font-medium text-slate-700 mb-1">
            Classe / القسم
          </label>
          <select id="select-classe" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            <option value="">-- Choisir la division --</option>
          </select>
        </div>

        <!-- Choix de la Matière -->
        <div>
          <label for="input-matiere" class="block text-sm font-medium text-slate-700 mb-1">
            Matière / المادة
          </label>
          <input type="text" id="input-matiere" value="Sciences / علوم" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <!-- Créneau Horaire -->
        <div>
          <label for="select-horaire" class="block text-sm font-medium text-slate-700 mb-1">
            Séance / التوقيت
          </label>
          <select id="select-horaire" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="08:00-09:00">08:00 - 09:00</option>
            <option value="09:00-10:00">09:00 - 10:00</option>
            <option value="10:00-11:00">10:00 - 11:00</option>
            <option value="11:00-12:00">11:00 - 12:00</option>
            <option value="13:30-14:30">13:30 - 14:30</option>
            <option value="14:30-15:30">14:30 - 15:30</option>
            <option value="15:30-16:30">15:30 - 16:30</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Barre de Statut & Compteurs Rapides -->
    <div id="stats-bar" class="hidden grid grid-cols-3 gap-3">
      <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl text-center">
        <span class="block text-xs font-semibold text-emerald-700 uppercase">Présents (حاضر)</span>
        <span id="count-presents" class="text-2xl font-bold text-emerald-600">0</span>
      </div>
      <div class="bg-rose-50 border border-rose-200 p-3 rounded-xl text-center">
        <span class="block text-xs font-semibold text-rose-700 uppercase">Absents (غائب)</span>
        <span id="count-absents" class="text-2xl font-bold text-rose-600">0</span>
      </div>
      <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-center">
        <span class="block text-xs font-semibold text-amber-700 uppercase">Retards (متأخر)</span>
        <span id="count-retards" class="text-2xl font-bold text-amber-600">0</span>
      </div>
    </div>

    <!-- Liste des Élèves de la classe -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
        <div>
          <h2 class="font-bold text-slate-800" id="classe-titre">Sélectionnez une classe</h2>
          <p class="text-xs text-slate-500" id="classe-effectif">0 élève chargé</p>
        </div>
        <button id="btn-tout-present" class="hidden text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
          <i class="fa-solid fa-check-double mr-1"></i> Tout marquer présent
        </button>
      </div>

      <div id="eleves-container" class="divide-y divide-slate-100 min-h-[160px] flex items-center justify-center p-6 text-slate-400">
        <div class="text-center">
          <i class="fa-solid fa-arrow-up text-2xl mb-2 text-indigo-300"></i>
          <p>Veuillez choisir une division pour afficher la liste des élèves.</p>
        </div>
      </div>
    </div>

    <!-- Bouton de validation en bas -->
    <div id="actions-footer" class="hidden pb-8">
      <button id="btn-valider-appel" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Valider et transmettre l'appel à la vie scolaire</span>
      </button>
    </div>

  </main>

  <script>
    // ========================================================
    // 1. CONFIGURATION SUPABASE
    // ========================================================
    const SUPABASE_URL = 'https://eixdnxponkbsmelircjm.supabase.co'; // ex: 'https://xyzcompany.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable__9tG8Pj4aZ14hJxh5b-vug_DmTQb7ww';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Variables globales
    let classesList = [];
    let currentEleves = [];
    let currentStatuts = {}; // { eleve_id: 'P' | 'A' | 'R' }
    let currentSeanceId = null;

    // Éléments du DOM
    const selectClasse = document.getElementById('select-classe');
    const inputMatiere = document.getElementById('input-matiere');
    const selectHoraire = document.getElementById('select-horaire');
    const elevesContainer = document.getElementById('eleves-container');
    const classeTitre = document.getElementById('classe-titre');
    const classeEffectif = document.getElementById('classe-effectif');
    const statsBar = document.getElementById('stats-bar');
    const actionsFooter = document.getElementById('actions-footer');
    const btnToutPresent = document.getElementById('btn-tout-present');
    const btnValider = document.getElementById('btn-valider-appel');

    // ========================================================
    // 2. INITIALISATION & CHARGEMENT DES CLASSES
    // ========================================================
    async function initClasses() {
      try {
        const { data, error } = await supabaseClient
          .from('classes')
          .select('id, nom_court, nom_complet')
          .order('nom_court', { ascending: true });

        if (error) throw error;

        classesList = data || [];
        selectClasse.innerHTML = '<option value="">-- Choisir la division --</option>';
        classesList.forEach(cls => {
          const opt = document.createElement('option');
          opt.value = cls.id;
          opt.textContent = `${cls.nom_court} - ${cls.nom_complet}`;
          selectClasse.appendChild(opt);
        });
      } catch (err) {
        console.error('Erreur de chargement des classes :', err);
        document.getElementById('conn-text').textContent = 'Erreur de connexion';
        document.getElementById('conn-badge').classList.replace('bg-indigo-800/80', 'bg-rose-800');
      }
    }

    // ========================================================
    // 3. CHARGEMENT DES ÉLÈVES DE LA CLASSE SÉLECTIONNÉE
    // ========================================================
    async function chargerEleves(classeId) {
      if (!classeId) {
        elevesContainer.innerHTML = `
          <div class="text-center p-6 text-slate-400">
            <i class="fa-solid fa-arrow-up text-2xl mb-2 text-indigo-300"></i>
            <p>Veuillez choisir une division pour afficher la liste des élèves.</p>
          </div>`;
        classeTitre.textContent = 'Sélectionnez une classe';
        classeEffectif.textContent = '0 élève chargé';
        statsBar.classList.add('hidden');
        actionsFooter.classList.add('hidden');
        btnToutPresent.classList.add('hidden');
        return;
      }

      // Loader
      elevesContainer.innerHTML = `
        <div class="p-8 text-center text-indigo-600">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl"></i>
          <p class="text-xs text-slate-500 mt-2">Chargement des élèves...</p>
        </div>`;

      const selectedCls = classesList.find(c => c.id == classeId);
      classeTitre.textContent = selectedCls ? `${selectedCls.nom_court} (${selectedCls.nom_complet})` : 'Classe';

      const { data, error } = await supabaseClient
        .from('eleves')
        .select('*')
        .eq('classe_id', classeId)
        .eq('actif', true)
        .order('nom', { ascending: true });

      if (error) {
        elevesContainer.innerHTML = `<div class="p-6 text-rose-500 text-sm">Erreur: ${error.message}</div>`;
        return;
      }

      currentEleves = data || [];
      classeEffectif.textContent = `${currentEleves.length} élèves inscrits`;

      // Par défaut, tous les élèves sont présents ('P')
      currentStatuts = {};
      currentEleves.forEach(e => currentStatuts[e.id] = 'P');

      afficherEleves();
      mettreAJourCompteurs();
      statsBar.classList.remove('hidden');
      actionsFooter.classList.remove('hidden');
      btnToutPresent.classList.remove('hidden');
    }

    // ========================================================
    // 4. RENDU VISUEL DE LA LISTE DES ÉLÈVES
    // ========================================================
    function afficherEleves() {
      if (currentEleves.length === 0) {
        elevesContainer.innerHTML = '<div class="p-6 text-slate-400 text-sm">Aucun élève trouvé dans cette classe.</div>';
        return;
      }

      elevesContainer.innerHTML = '';
      currentEleves.forEach((eleve, index) => {
        const row = document.createElement('div');
        row.className = 'p-3 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition';

        const statut = currentStatuts[eleve.id] || 'P';

        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 text-xs font-mono text-slate-400 font-bold">${index + 1}</span>
            <div>
              <p class="text-sm font-bold text-slate-800">${eleve.nom} ${eleve.prenom}</p>
              <p class="text-xs text-slate-500 font-arabic" dir="rtl">${eleve.nom_ar || ''} ${eleve.prenom_ar || ''}</p>
            </div>
          </div>
          <!-- Sélecteur de Présence / Absence / Retard -->
          <div class="flex items-center gap-1.5 self-end sm:self-center">
            <button type="button" onclick="changerStatut(${eleve.id}, 'P')" 
              class="btn-statut px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 
              ${statut === 'P' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-emerald-50'}">
              <i class="fa-solid fa-check"></i> Présent
            </button>
            <button type="button" onclick="changerStatut(${eleve.id}, 'A')" 
              class="btn-statut px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 
              ${statut === 'A' ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-rose-50'}">
              <i class="fa-solid fa-xmark"></i> Absent
            </button>
            <button type="button" onclick="changerStatut(${eleve.id}, 'R')" 
              class="btn-statut px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 
              ${statut === 'R' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-amber-50'}">
              <i class="fa-solid fa-clock"></i> Retard
            </button>
          </div>
        `;
        elevesContainer.appendChild(row);
      });
    }

    // Gestion du changement de statut pour un élève
    window.changerStatut = function(eleveId, nouveauStatut) {
      currentStatuts[eleveId] = nouveauStatut;
      afficherEleves();
      mettreAJourCompteurs();
    };

    // Bouton "Tout marquer présent"
    btnToutPresent.addEventListener('click', () => {
      currentEleves.forEach(e => currentStatuts[e.id] = 'P');
      afficherEleves();
      mettreAJourCompteurs();
    });

    function mettreAJourCompteurs() {
      let p = 0, a = 0, r = 0;
      Object.values(currentStatuts).forEach(st => {
        if (st === 'P') p++;
        else if (st === 'A') a++;
        else if (st === 'R') r++;
      });
      document.getElementById('count-presents').textContent = p;
      document.getElementById('count-absents').textContent = a;
      document.getElementById('count-retards').textContent = r;
    }

    // ========================================================
    // 5. ENREGISTREMENT & TRANSMISSION DE L'APPEL
    // ========================================================
    btnValider.addEventListener('click', async () => {
      const classeId = selectClasse.value;
      if (!classeId || currentEleves.length === 0) {
        alert('Veuillez d’abord sélectionner une classe valide.');
        return;
      }

      btnValider.disabled = true;
      btnValider.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Transmission en cours...`;

      try {
        const horaire = selectHoraire.value.split('-');
        const heureDebut = horaire[0] + ':00';
        const heureFin = horaire[1] + ':00';
        const today = new Date().toISOString().split('T')[0];

        // 1. Récupérer ou créer la séance du jour pour cette classe
        let { data: seance, error: seanceErr } = await supabaseClient
          .from('seances')
          .insert({
            classe_id: classeId,
            matiere: inputMatiere.value,
            date_cours: today,
            heure_debut: heureDebut,
            heure_fin: heureFin,
            appel_valide: true
          })
          .select()
          .single();

        if (seanceErr) throw seanceErr;
        currentSeanceId = seance.id;

        // 2. Préparer les pointages à enregistrer
        const pointagesRows = currentEleves.map(e => ({
          seance_id: currentSeanceId,
          eleve_id: e.id,
          statut: currentStatuts[e.id] || 'P'
        }));

        const { error: ptError } = await supabaseClient
          .from('pointages')
          .insert(pointagesRows);

        if (ptError) throw ptError;

        // Message de succès
        alert(' Appel transmis avec succès à la vie scolaire !');
      } catch (err) {
        console.error('Erreur lors de la validation :', err);
        alert('Erreur lors de la transmission : ' + err.message);
      } finally {
        btnValider.disabled = false;
        btnValider.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Valider et transmettre l'appel à la vie scolaire`;
      }
    });

    // Écouteur sur le menu déroulant
    selectClasse.addEventListener('change', (e) => {
      chargerEleves(e.target.value);
    });

    // Lancer au chargement de la page
    window.addEventListener('DOMContentLoaded', initClasses);
  </script>
</body>
</html>
