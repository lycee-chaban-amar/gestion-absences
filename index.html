<!-- Paramètres du cours -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-500 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-indigo-600"></i> Paramètres du Cours
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Sélection de la division -->
        <div>
          <label for="select-classe" class="block text-sm font-medium text-slate-700 mb-1">
            Classe / القسم
          </label>
          <select id="select-classe" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            <option value="">-- Choisir la division / اختر الفوج --</option>
          </select>
        </div>

        <!-- Sélection de la matière (Liste déroulante organisée) -->
        <div>
          <label for="select-matiere" class="block text-sm font-medium text-slate-700 mb-1">
            Matière / المادة
          </label>
          <select id="select-matiere" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
            <optgroup label="📚 Matières Fondamentales & Scientifiques">
              <option value="Mathématiques / رياضيات" selected>رياضيات / Mathématiques</option>
              <option value="Sciences Naturelles / علوم الطبيعة والحياة">علوم الطبيعة والحياة / Sciences Naturelles</option>
              <option value="Sciences Physiques / علوم فيزيائية">علوم فيزيائية / Sciences Physiques</option>
              <option value="Informatique / إعلام آلي">إعلام آلي / Informatique</option>
            </optgroup>
            
            <optgroup label="⚙️ Spécialités Techniques & Économie">
              <option value="Génie Civil / هندسة مدنية">هندسة مدنية / Génie Civil</option>
              <option value="Génie Électrique / هندسة كهربائية">هندسة كهربائية / Génie Électrique</option>
              <option value="Génie Mécanique / هندسة ميكانيكية">هندسة ميكانيكية / Génie Mécanique</option>
              <option value="Génie des Procédés / هندسة الطرائق">هندسة الطرائق / Génie des Procédés</option>
              <option value="Gestion & Économie / تسيير واقتصاد">تسيير واقتصاد / Gestion & Économie</option>
              <option value="Droit / قانون">قانون / Droit</option>
            </optgroup>

            <optgroup label="📖 Lettres, Sciences Humaines & Langues">
              <option value="Langue Arabe / لغة عربية وآدابها">لغة عربية وآدابها / Langue Arabe</option>
              <option value="Langue Française / لغة فرنسية">لغة فرنسية / Langue Française</option>
              <option value="Langue Anglaise / لغة إنجليزية">لغة إنجليزية / Langue Anglaise</option>
              <option value="Langue Allemande / لغة ألمانية">لغة ألمانية / Langue Allemande</option>
              <option value="Langue Espagnole / لغة إسبانية">لغة إسبانية / Langue Espagnole</option>
              <option value="Langue Amazighe / لغة أمازيغية">لغة أمازيغية / Tamazight</option>
              <option value="Philosophie / فلسفة">فلسفة / Philosophie</option>
              <option value="Histoire-Géographie / تاريخ وجغرافيا">تاريخ وجغرافيا / Histoire-Géo</option>
              <option value="Sciences Islamiques / علوم إسلامية">علوم إسلامية / Sciences Islamiques</option>
            </optgroup>

            <optgroup label="🏃 Éducation Physique">
              <option value="EPS / تربية بدنية ورياضية">تربية بدنية ورياضية / Sport (EPS)</option>
            </optgroup>
          </select>
        </div>

        <!-- Sélection de la séance (08h-12h et 13h-17h) -->
        <div>
          <label for="select-horaire" class="block text-sm font-medium text-slate-700 mb-1">
            Séance / التوقيت
          </label>
          <select id="select-horaire" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition">
            <optgroup label="☀️ Matin / الصباح">
              <option value="08:00-09:00">08:00 - 09:00</option>
              <option value="09:00-10:00">09:00 - 10:00</option>
              <option value="10:00-11:00">10:00 - 11:00</option>
              <option value="11:00-12:00">11:00 - 12:00</option>
            </optgroup>
            <optgroup label="🌤️ Après-midi / المساء">
              <option value="13:00-14:00">13:00 - 14:00</option>
              <option value="14:00-15:00">14:00 - 15:00</option>
              <option value="15:00-16:00">15:00 - 16:00</option>
              <option value="16:00-17:00">16:00 - 17:00</option>
            </optgroup>
          </select>
        </div>
      </div>
    </div>
