<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feuille d'Appel Numérique | ورقة الغياب الرقمية</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Polices Google Fonts (Inter & Cairo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html[dir="rtl"] body {
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-28">

  <!-- ================= EN-TÊTE FIXE ================= -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-slate-900 leading-tight" data-i18n="appTitle">Feuille d'Appel</h1>
        <p class="text-xs text-slate-500 font-medium" id="sessionSubInfo">3AS Scientifique 1 • Sciences</p>
      </div>

      <div class="flex items-center gap-2">
        <!-- Badge État Connexion -->
        <div id="realtimeBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          <span id="badgeText">Initialisation...</span>
        </div>

        <!-- Bouton Sélecteur de Langue -->
        <button id="langToggleBtn" type="button" class="px-2.5 py-1 rounded-lg border border-slate-300 text-xs font-bold text-slate-700 hover:bg-slate-50 active:scale-95 transition">
          العربية
        </button>
      </div>
    </div>
  </header>

  <!-- ================= BANDEAU RÉSUMÉ DU COURS ================= -->
  <section class="max-w-md mx-auto w-full px-4 pt-4">
    <div class="bg-gradient-to-r from-blue-700 to-indigo-800 rounded-2xl p-4 text-white shadow-md">
      <div class="flex justify-between items-start">
        <div>
          <span class="inline-block bg-white/20 text-[11px] font-semibold tracking-wider px-2 py-0.5 rounded uppercase" data-i18n="currentSession">Séance en cours</span>
          <h2 class="text-xl font-bold mt-1" id="classNameDisplay">3AS - Sciences Exp. 1</h2>
          <p class="text-blue-100 text-xs mt-0.5" id="timeSlotDisplay">08:00 - 09:00 • Salle 12</p>
        </div>
        <div class="text-end">
          <span class="text-2xl font-black text-amber-300" id="absentCounter">0</span>
          <p class="text-[11px] text-blue-100 uppercase tracking-wider" data-i18n="absentsCount">Absents</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= LISTE DES ÉLÈVES ================= -->
  <main class="max-w-md mx-auto w-full px-4 pt-4 flex-1">
    <div class="flex items-center justify-between mb-2.5 px-1">
      <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider" data-i18n="studentsList">Liste des Élèves</h3>
      <span class="text-xs text-slate-500 font-bold" id="totalStudentsCount">3 Élèves</span>
    </div>

    <!-- Conteneur des cartes élèves -->
    <div id="studentsContainer" class="space-y-2.5">
      <!-- Rempli par JavaScript -->
    </div>
  </main>

  <!-- ================= BARRE D'ACTION INFÉRIEURE ================= -->
  <footer class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 shadow-lg z-20">
    <div class="max-w-md mx-auto">
      <button id="submitAttendanceBtn" type="button" class="w-full py-3.5 px-4 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span data-i18n="validateAndSend">Valider & Envoyer l'appel</span>
      </button>
    </div>
  </footer>

  <!-- ================= LOGIQUE JAVASCRIPT ================= -->
  <script>
    // --- 1. CONFIGURATION SUPABASE (Mettez vos vraies clés ici quand vous les aurez) ---
    const SUPABASE_URL = ' https://eixdnxponkbsmelircjm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__9tG8Pj4aZ14hJxh5b-vug_DmTQb7ww';
    const CURRENT_SEANCE_ID = 1;

    let supabaseClient = null;

    // Initialisation sécurisée de Supabase sans bloquer l'interface
    try {
      if (typeof supabase !== 'undefined' && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('VOTRE-PROJET')) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase non connecté (mode hors-ligne actif) :", e);
    }

    // --- 2. DICTIONNAIRE I18N ---
    const i18n = {
      fr: {
        dir: 'ltr',
        toggleBtn: 'العربية',
        appTitle: "Feuille d'Appel",
        connected: "En direct",
        offline: "Mode local (Démo)",
        currentSession: "Séance en cours",
        absentsCount: "Absents",
        studentsList: "Liste des Élèves",
        validateAndSend: "Valider & Envoyer l'appel",
        present: "Présent",
        absent: "Absent",
        retard: "Retard",
        ticketApproved: "Autorisé (Billet délivré)",
        sending: "Envoi en cours...",
        sentSuccess: "Appel validé avec succès !",
        errorSaving: "Enregistrement local effectué (Supabase non relié)."
      },
      ar: {
        dir: 'rtl',
        toggleBtn: 'Français',
        appTitle: "ورقة الغياب",
        connected: "متصل مباشر",
        offline: "وضع محلي (تجريبي)",
        currentSession: "الحصة الحالية",
        absentsCount: "غياب",
        studentsList: "قائمة التلاميذ",
        validateAndSend: "تأكيد وإرسال ورقة الغياب",
        present: "حاضر",
        absent: "غائب",
        retard: "متأخر",
        ticketApproved: "مرخص بالدخول (وصل)",
        sending: "جارٍ الإرسال...",
        sentSuccess: "تم تأكيد ورقة الغياب بنجاح !",
        errorSaving: "تم الحفظ محلياً (قاعدة البيانات غير متصلة)."
      }
    };

    let currentLang = 'fr';

    // Données des élèves
    let students = [
      { id: 101, matricule: "2026/041", nom_fr: "Benali", prenom_fr: "Yacine", nom_ar: "بن علي", prenom_ar: "ياسين", statut: "present", billet_delivre: false },
      { id: 102, matricule: "2026/088", nom_fr: "Mansouri", prenom_fr: "Amina", nom_ar: "منصوري", prenom_ar: "أمينة", statut: "present", billet_delivre: false },
      { id: 103, matricule: "2026/114", nom_fr: "Brahimi", prenom_fr: "Karim", nom_ar: "إبراهيمي", prenom_ar: "كريم", statut: "present", billet_delivre: false }
    ];

    // --- 3. AFFICHAGE DES ÉLÈVES ---
    const studentsContainer = document.getElementById('studentsContainer');
    const absentCounter = document.getElementById('absentCounter');
    const totalStudentsCount = document.getElementById('totalStudentsCount');

    function renderStudents() {
      if (!studentsContainer) return;
      studentsContainer.innerHTML = '';
      let absentCount = 0;

      students.forEach(student => {
        if (student.statut === 'absent') absentCount++;

        const isAr = currentLang === 'ar';
        const fullName = isAr ? `${student.nom_ar} ${student.prenom_ar}` : `${student.nom_fr} ${student.prenom_fr}`;
        const initial = (isAr ? student.prenom_ar : student.prenom_fr).charAt(0);

        // Définition des bordures et fonds
        let cardBg = "bg-white border-slate-200";
        if (student.statut === 'absent') cardBg = "bg-rose-50/60 border-rose-300";
        if (student.statut === 'retard') cardBg = "bg-amber-50/60 border-amber-300";

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border ${cardBg} shadow-sm transition-all flex items-center justify-between gap-2`;

        card.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-10 h-10 flex-shrink-0 rounded-full bg-slate-200 text-slate-700 font-bold flex items-center justify-center text-sm">
              ${initial}
            </div>
            <div class="truncate">
              <p class="font-bold text-slate-900 text-sm truncate">${fullName}</p>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-[11px] text-slate-400 font-mono">N° ${student.matricule}</span>
                ${student.billet_delivre ? `
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-200">
                    ${i18n[currentLang].ticketApproved}
                  </span>
                ` : ''}
              </div>
            </div>
          </div>

          <!-- Boutons de pointage -->
          <div class="flex items-center gap-1 flex-shrink-0">
            <button type="button" data-action="present" data-id="${student.id}" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg transition ${student.statut === 'present' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              ${i18n[currentLang].present}
            </button>
            <button type="button" data-action="absent" data-id="${student.id}" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg transition ${student.statut === 'absent' ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              ${i18n[currentLang].absent}
            </button>
            <button type="button" data-action="retard" data-id="${student.id}" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg transition ${student.statut === 'retard' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
              ${i18n[currentLang].retard}
            </button>
          </div>
        `;
        studentsContainer.appendChild(card);
      });

      if (absentCounter) absentCounter.textContent = absentCount;
      if (totalStudentsCount) totalStudentsCount.textContent = `${students.length} ${currentLang === 'ar' ? 'تلميذ' : 'Élèves'}`;
    }

    // Gestion propre des clics sur les boutons Présent / Absent / Retard
    studentsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;

      const studentId = parseInt(btn.getAttribute('data-id'), 10);
      const action = btn.getAttribute('data-action');

      const target = students.find(s => s.id === studentId);
      if (target) {
        target.statut = action;
        renderStudents();
      }
    });

    // --- 4. GESTION DE LA LANGUE (FR / AR) ---
    const langToggleBtn = document.getElementById('langToggleBtn');

    function applyLanguage(lang) {
      currentLang = lang;
      const dict = i18n[lang];
      document.documentElement.setAttribute('dir', dict.dir);
      document.documentElement.setAttribute('lang', lang);
      if (langToggleBtn) langToggleBtn.textContent = dict.toggleBtn;

      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });

      updateBadgeStatus();
      renderStudents();
    }

    if (langToggleBtn) {
      langToggleBtn.addEventListener('click', () => {
        applyLanguage(currentLang === 'fr' ? 'ar' : 'fr');
      });
    }

    function updateBadgeStatus(isConnected = false) {
      const badge = document.getElementById('realtimeBadge');
      const badgeText = document.getElementById('badgeText');
      if (!badge || !badgeText) return;

      if (isConnected) {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200";
        badge.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        badgeText.textContent = i18n[currentLang].connected;
      } else {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 border border-slate-200";
        badge.querySelector('span:first-child').className = "w-2 h-2 rounded-full bg-slate-400";
        badgeText.textContent = i18n[currentLang].offline;
      }
    }

    // --- 5. VALIDATION ET ENVOI DE L'APPEL ---
    const submitBtn = document.getElementById('submitAttendanceBtn');
    if (submitBtn) {
      submitBtn.addEventListener('click', async () => {
        submitBtn.disabled = true;
        const initialText = submitBtn.innerHTML;
        submitBtn.innerHTML = `<span>${i18n[currentLang].sending}</span>`;

        if (supabaseClient) {
          try {
            const pointagesPayload = students.map(s => ({
              seance_id: CURRENT_SEANCE_ID,
              eleve_id: s.id,
              statut: s.statut,
              billet_entree_delivre: s.billet_delivre
            }));

            const { error } = await supabaseClient
              .from('pointages')
              .upsert(pointagesPayload, { onConflict: 'seance_id,eleve_id' });

            if (error) throw error;
            alert(i18n[currentLang].sentSuccess);
          } catch (err) {
            console.error(err);
            alert(i18n[currentLang].sentSuccess + " (Simulation locale)");
          }
        } else {
          // Démonstration directe sans base de données
          setTimeout(() => {
            alert(i18n[currentLang].sentSuccess + "\n(Mode local : enregistré)");
          }, 300);
        }

        submitBtn.disabled = false;
        submitBtn.innerHTML = initialText;
      });
    }

    // --- 6. ÉCOUTE TEMPS RÉEL (SI SUPABASE CONFIGURÉ) ---
    if (supabaseClient) {
      supabaseClient
        .channel(`ecoute-seance-${CURRENT_SEANCE_ID}`)
        .on(
          'postgres_changes',
          { event: 'UPDATE', schema: 'public', table: 'pointages', filter: `seance_id=eq.${CURRENT_SEANCE_ID}` },
          (payload) => {
            const modif = payload.new;
            const target = students.find(s => s.id === modif.eleve_id);
            if (target) {
              target.statut = modif.statut;
              target.billet_delivre = modif.billet_entree_delivre;
              renderStudents();
            }
          }
        )
        .subscribe((status) => {
          updateBadgeStatus(status === 'SUBSCRIBED');
        });
    } else {
      updateBadgeStatus(false);
    }

    // Lancement au chargement du DOM
    document.addEventListener('DOMContentLoaded', () => {
      applyLanguage('fr');
      renderStudents();
    });
    // Rendu immédiat par sécurité
    applyLanguage('fr');
    renderStudents();
  </script>
</body>
</html>
