<!DOCTYPE html>
<html lang="fr" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enseignant - Appel - ثانوية الشهيد شعبان اعمر</title>
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        
        /* Custom Radio Buttons for Attendance */
        .attendance-radio:checked + div.present-btn { background-color: #10b981; color: white; border-color: #10b981; }
        .attendance-radio:checked + div.absent-btn { background-color: #f43f5e; color: white; border-color: #f43f5e; }
        .attendance-radio:checked + div.retard-btn { background-color: #f59e0b; color: white; border-color: #f59e0b; }
        
        .attendance-btn { transition: all 0.2s ease; }
        .attendance-btn:active { transform: scale(0.95); }
        
        /* Select styling to remove default arrow on some browsers */
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
        
        /* Loading spinner */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-radius: 50%; border-top: 3px solid #6366f1; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- HEADER -->
    <header class="bg-[#0b1120] border-b border-slate-800 sticky top-0 z-40">
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">ثانوية الشهيد شعبان اعمر</h1>
                    <p class="text-[10px] text-slate-400">ورقة الغياب الرقمية</p>
                </div>
            </div>
            <div class="flex gap-2">
                <a href="superviseur.html" class="bg-indigo-900/50 text-indigo-300 border border-indigo-700/50 px-3 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1.5 hover:bg-indigo-800/50 transition">
                    <i class="fa-solid fa-shield-halved"></i> Admin
                </a>
            </div>
        </div>
    </header>

    <main class="p-4 space-y-4 max-w-2xl mx-auto">
        
        <!-- CARD INFO SEANCE -->
        <div class="bg-[#1e293b] rounded-2xl p-4 border border-slate-700/50 shadow-lg">
            <h2 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-calendar-day text-indigo-400"></i>
                معلومات الحصة / Informations de la séance
            </h2>
            
            <div class="space-y-4">
                <!-- Date -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-lock text-rose-500 text-[9px]"></i> التاريخ / Date
                    </label>
                    <input type="date" id="date_cours" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 text-white font-bold text-sm outline-none focus:border-indigo-500" dir="ltr" />
                </div>
                
                <!-- Heure (Menu déroulant corrigé) -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">التوقيت / Heure</label>
                    <div class="relative">
                        <select id="heure_cours" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 text-white font-bold text-sm outline-none focus:border-indigo-500 cursor-pointer" dir="ltr">
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                            <option value="17:00">17:00</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-slate-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- Matière -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1 flex items-center gap-1">
                        <i class="fa-solid fa-lock text-rose-500 text-[9px]"></i> المادة / Matière
                    </label>
                    <input type="text" id="matiere_cours" value="الرياضيات" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-4 py-3 text-white font-bold text-sm outline-none focus:border-indigo-500 text-right" />
                </div>

                <!-- Classe -->
                <div>
                    <label class="block text-[11px] font-bold text-indigo-400 mb-1">* القسم / Classe</label>
                    <div class="relative">
                        <select id="select_classe" onchange="chargerEleves()" class="w-full bg-indigo-900/20 border-2 border-indigo-600/50 rounded-xl px-4 py-3 text-white font-bold text-sm outline-none focus:border-indigo-500 cursor-pointer text-right appearance-none pr-10">
                            <option value="">-- إختر القسم --</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-indigo-400">
                            <i class="fa-solid fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LISTE DES ELEVES -->
        <div class="bg-[#1e293b] rounded-2xl p-4 border border-slate-700/50 shadow-lg" id="zone-appel">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-400"></i>
                    قائمة التلاميذ / Liste d'appel
                    <span id="compteur-eleves" class="bg-indigo-600 text-white text-[10px] px-2 py-0.5 rounded-md ml-2">0</span>
                </h2>
            </div>

            <!-- Actions Rapides -->
            <div class="flex gap-2 mb-4 overflow-x-auto pb-2 scrollbar-hide" dir="ltr">
                <button type="button" onclick="ouvrirModalAjout()" class="shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-xl text-[11px] font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-user-plus"></i> Ajouter un élève
                </button>
                <button type="button" class="shrink-0 bg-slate-700 hover:bg-slate-600 text-white px-3 py-2 rounded-xl text-[11px] font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-list-check"></i> Fiche Évaluation
                </button>
                <button type="button" class="shrink-0 bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-2 rounded-xl text-[11px] font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-calendar-days"></i> Fiche Suivi Mensuel
                </button>
            </div>

            <!-- Table En-tête -->
            <div class="grid grid-cols-12 gap-2 border-b border-slate-700 pb-2 mb-3 text-[10px] font-bold text-slate-400 text-center">
                <div class="col-span-1">N°</div>
                <div class="col-span-5 text-right pr-2">الاسم واللقب / Nom & Prénom</div>
                <div class="col-span-2 text-[#10b981]">PRÉSENT</div>
                <div class="col-span-2 text-[#f43f5e]">ABSENT</div>
                <div class="col-span-2 text-[#f59e0b]">RETARD</div>
            </div>

            <!-- Conteneur Liste -->
            <div id="liste-eleves" class="space-y-3">
                <div class="text-center py-8 text-slate-500 text-xs font-bold">
                    يرجى اختيار القسم لعرض قائمة التلاميذ<br>Veuillez sélectionner une classe.
                </div>
            </div>
        </div>

    </main>

    <!-- BOUTON FLOTTANT ENREGISTRER -->
    <div class="fixed bottom-0 left-0 w-full bg-[#0f172a]/90 backdrop-blur-md border-t border-slate-800 p-4 z-40">
        <button type="button" id="btn-soumettre" onclick="soumettreAppel()" class="w-full max-w-2xl mx-auto block bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-black py-4 rounded-2xl shadow-[0_0_15px_rgba(16,185,129,0.3)] transition-all flex justify-center items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Enregistrer et Transmettre à l'Administration</span>
        </button>
    </div>

    <!-- MODAL AJOUT ELEVE -->
    <div id="modal-ajout-eleve" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#1e293b] rounded-2xl p-5 w-full max-w-sm border border-slate-700">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 class="font-bold text-white flex items-center gap-2"><i class="fa-solid fa-user-plus text-indigo-400"></i> إضافة تلميذ جديد</h3>
                <button onclick="fermerModalAjout()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3" dir="rtl">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">اللقب (Nom)</label>
                    <input type="text" id="new-nom" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-indigo-500" />
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">الاسم (Prénom)</label>
                    <input type="text" id="new-prenom" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl px-3 py-2.5 text-white text-sm outline-none focus:border-indigo-500" />
                </div>
            </div>
            <div class="mt-5 flex gap-2">
                <button onclick="ajouterEleve()" id="btn-save-eleve" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-bold">حفظ / Enregistrer</button>
                <button onclick="fermerModalAjout()" class="px-4 bg-slate-700 text-white rounded-xl text-sm font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eixdnxponkbsmelircjm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable__9tG8Pj4aZ14hJxh5b-vug_DmTQb7ww';
        
        let supabaseClient = null;
        let listeElevesActuels = [];
        let classeActuelleId = null;

        // Initialisation de la date du jour
        document.getElementById('date_cours').value = new Date().toISOString().split('T')[0];

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            chargerListeClasses();
        } catch (e) {
            console.error("Erreur init Supabase", e);
            alert("Erreur de connexion à la base de données.");
        }

        // 1. Charger les classes dans le select
        async function chargerListeClasses() {
            try {
                const { data, error } = await supabaseClient
                    .from('classes')
                    .select('id, nom_court, nom_complet')
                    .order('nom_court');
                
                if (error) throw error;
                
                const select = document.getElementById('select_classe');
                data.forEach(cls => {
                    const opt = document.createElement('option');
                    opt.value = cls.id;
                    opt.textContent = `${cls.nom_court} — ${cls.nom_complet}`;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Erreur chargement classes", err);
            }
        }

        // 2. Charger les élèves de la classe sélectionnée
        async function chargerEleves() {
            const select = document.getElementById('select_classe');
            const conteneur = document.getElementById('liste-eleves');
            const compteur = document.getElementById('compteur-eleves');
            
            classeActuelleId = select.value;
            
            if (!classeActuelleId) {
                conteneur.innerHTML = '<div class="text-center py-8 text-slate-500 text-xs font-bold">يرجى اختيار القسم لعرض قائمة التلاميذ</div>';
                compteur.textContent = "0";
                return;
            }

            conteneur.innerHTML = '<div class="flex justify-center py-8"><div class="loader"></div></div>';

            try {
                const { data, error } = await supabaseClient
                    .from('eleves')
                    .select('id, nom, prenom, nom_ar, prenom_ar')
                    .eq('classe_id', classeActuelleId)
                    .eq('actif', true)
                    .order('nom');

                if (error) throw error;

                listeElevesActuels = data || [];
                compteur.textContent = listeElevesActuels.length;
                renderEleves();

            } catch (err) {
                conteneur.innerHTML = `<div class="text-rose-500 text-center text-xs font-bold py-4">Erreur: ${err.message}</div>`;
            }
        }

        // 3. Afficher les lignes d'élèves
        function renderEleves() {
            const conteneur = document.getElementById('liste-eleves');
            
            if (listeElevesActuels.length === 0) {
                conteneur.innerHTML = '<div class="text-center py-8 text-amber-500 text-xs font-bold"><i class="fa-solid fa-triangle-exclamation text-2xl mb-2 block"></i>لا يوجد تلاميذ مسجلين في هذا القسم<br>Aucun élève dans cette classe.</div>';
                return;
            }

            let html = '';
            listeElevesActuels.forEach((eleve, index) => {
                const nomCompletAr = `${eleve.nom_ar || eleve.nom} ${eleve.prenom_ar || eleve.prenom}`.trim();
                const nomCompletFr = `${eleve.nom} ${eleve.prenom}`;
                
                html += `
                <div class="grid grid-cols-12 gap-2 items-center bg-[#0f172a] p-2 rounded-xl border border-slate-700/50">
                    <div class="col-span-1 text-center text-[10px] font-bold text-slate-500">${index + 1}</div>
                    
                    <div class="col-span-5 text-right pr-1 leading-tight">
                        <div class="text-sm font-bold text-white truncate" dir="rtl">${nomCompletAr}</div>
                        <div class="text-[9px] text-slate-400 truncate" dir="ltr">${nomCompletFr}</div>
                    </div>
                    
                    <!-- PRESENT -->
                    <div class="col-span-2">
                        <label class="block relative cursor-pointer h-10">
                            <input type="radio" name="statut_${eleve.id}" value="P" checked class="attendance-radio sr-only" />
                            <div class="present-btn attendance-btn w-full h-full rounded-lg border-2 border-slate-600 bg-slate-800 text-slate-400 flex justify-center items-center text-xs font-bold">حاضر</div>
                        </label>
                    </div>
                    
                    <!-- ABSENT -->
                    <div class="col-span-2">
                        <label class="block relative cursor-pointer h-10">
                            <input type="radio" name="statut_${eleve.id}" value="A" class="attendance-radio sr-only" />
                            <div class="absent-btn attendance-btn w-full h-full rounded-lg border-2 border-slate-600 bg-slate-800 text-slate-400 flex justify-center items-center text-xs font-bold">غائب</div>
                        </label>
                    </div>
                    
                    <!-- RETARD -->
                    <div class="col-span-2">
                        <label class="block relative cursor-pointer h-10">
                            <input type="radio" name="statut_${eleve.id}" value="R" class="attendance-radio sr-only" />
                            <div class="retard-btn attendance-btn w-full h-full rounded-lg border-2 border-slate-600 bg-slate-800 text-slate-400 flex justify-center items-center text-xs font-bold">متأخر</div>
                        </label>
                    </div>
                </div>
                `;
            });
            
            conteneur.innerHTML = html;
        }

        // 4. Soumettre l'appel
        async function soumettreAppel() {
            if (!classeActuelleId || listeElevesActuels.length === 0) {
                alert("Veuillez sélectionner une classe avec des élèves.");
                return;
            }

            const dateCours = document.getElementById('date_cours').value;
            const heureCours = document.getElementById('heure_cours').value;
            const matiere = document.getElementById('matiere_cours').value.trim();

            if (!dateCours || !heureCours || !matiere) {
                alert("Veuillez remplir la date, l'heure et la matière.");
                return;
            }

            const btn = document.getElementById('btn-soumettre');
            const texteOriginal = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-xl"></i> <span>Enregistrement en cours...</span>`;

            try {
                // Créer la séance
                const { data: seanceData, error: seanceErr } = await supabaseClient
                    .from('seances')
                    .insert([{
                        classe_id: classeActuelleId,
                        date_cours: dateCours,
                        heure_debut: heureCours,
                        matiere: matiere,
                        enseignant_id: null // Facultatif dans cette version rapide
                    }])
                    .select('id')
                    .single();

                if (seanceErr) throw seanceErr;
                const seanceId = seanceData.id;

                // Préparer les pointages
                const pointages = listeElevesActuels.map(eleve => {
                    const statut = document.querySelector(`input[name="statut_${eleve.id}"]:checked`).value;
                    return {
                        seance_id: seanceId,
                        eleve_id: eleve.id,
                        statut: statut,
                        archive: false,
                        justifie: false
                    };
                });

                // Insérer les pointages (uniquement les Absents et Retards pour alléger, ou tout le monde selon votre choix. Ici on met tout le monde).
                const { error: ptgErr } = await supabaseClient.from('pointages').insert(pointages);
                if (ptgErr) throw ptgErr;

                // Succès
                btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                btn.classList.add('bg-indigo-600');
                btn.innerHTML = `<i class="fa-solid fa-check text-xl"></i> <span>Appel enregistré avec succès !</span>`;
                
                setTimeout(() => {
                    btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                    btn.classList.remove('bg-indigo-600');
                    btn.innerHTML = texteOriginal;
                    btn.disabled = false;
                    
                    // Remettre tout le monde "Présent"
                    document.querySelectorAll('input[value="P"]').forEach(radio => radio.checked = true);
                }, 3000);

            } catch (err) {
                console.error(err);
                alert("Erreur lors de l'enregistrement : " + err.message);
                btn.disabled = false;
                btn.innerHTML = texteOriginal;
            }
        }

        // 5. Gestion Modal Ajout Rapide
        function ouvrirModalAjout() {
            if(!classeActuelleId) { alert("Choisissez d'abord un classe !"); return; }
            document.getElementById('modal-ajout-eleve').classList.remove('hidden');
            document.getElementById('modal-ajout-eleve').classList.add('flex');
            document.getElementById('new-nom').value = '';
            document.getElementById('new-prenom').value = '';
            document.getElementById('new-nom').focus();
        }
        
        function fermerModalAjout() {
            document.getElementById('modal-ajout-eleve').classList.add('hidden');
            document.getElementById('modal-ajout-eleve').classList.remove('flex');
        }

        async function ajouterEleve() {
            const nomAr = document.getElementById('new-nom').value.trim();
            const prenomAr = document.getElementById('new-prenom').value.trim();
            
            if(!nomAr || !prenomAr) { alert("Remplissez le nom et prénom."); return; }

            const btn = document.getElementById('btn-save-eleve');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const { error } = await supabaseClient.from('eleves').insert([{
                    classe_id: classeActuelleId,
                    nom_ar: nomAr,
                    prenom_ar: prenomAr,
                    nom: nomAr,     // Fallback
                    prenom: prenomAr, // Fallback
                    actif: true
                }]);

                if (error) throw error;
                
                fermerModalAjout();
                chargerEleves(); // Recharger la liste pour afficher le petit nouveau
                
            } catch (err) {
                alert("Erreur ajout : " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'حفظ / Enregistrer';
            }
        }

    </script>
</body>
</html>
