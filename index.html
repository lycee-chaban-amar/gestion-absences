<!DOCTYPE html>
<html lang="fr" dir="ltr" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enseignant - ثانوية الشهيد شعبان اعمر</title>
  
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
    button, select, input { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    button:active { transform: scale(0.96); }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-table-row { animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes alertPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.05); opacity: 0.85; } }
    .badge-alerte-rouge { animation: alertPulse 1.4s infinite ease-in-out; }
    .font-amiri { font-family: 'Amiri', serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <header class="bg-slate-900 dark:bg-slate-950 text-white shadow-md border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-emerald-600 flex items-center justify-center text-2xl shadow-md">
          <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <div class="border-l-2 border-slate-700 pl-4">
          <h1 class="text-lg font-bold tracking-tight">Espace Enseignant <span class="text-emerald-400 mx-1">|</span> فضاء الأستاذ</h1>
          <p class="text-base text-emerald-300 font-amiri mt-0.5">ثانوية الشهيد شعبان اعمر - ورقة الغياب الرقمية</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" onclick="toggleDarkMode()" id="btn-darkmode" class="text-xs font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 px-3.5 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-moon text-amber-300" id="icon-darkmode"></i>
        </button>
        <a href="superviseur.html" class="text-xs font-semibold text-slate-300 bg-slate-800 hover:bg-slate-700 px-3.5 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-shield-halved text-indigo-400"></i><span>Administration</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    
    <!-- Bloc Informations de la Séance -->
    <div class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 relative overflow-hidden">
      <div class="absolute top-0 right-0 bg-emerald-500 text-white text-[10px] font-black uppercase tracking-widest py-1 px-4 rounded-bl-xl shadow-sm">Officiel</div>
      <h2 class="text-lg font-extrabold mb-5 text-slate-800 dark:text-white flex items-center gap-2">
        <i class="fa-solid fa-calendar-day text-emerald-500"></i>
        <span>Informations de la séance / معلومات الحصة</span>
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1.5">Date / التاريخ <i class="fa-solid fa-lock text-rose-500 text-[10px] ml-1" title="Verrouillé"></i></label>
          <input type="date" id="date-cours" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2.5 text-sm text-slate-500 cursor-not-allowed outline-none font-bold" readonly />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1.5">Heure / التوقيت <i class="fa-solid fa-lock text-rose-500 text-[10px] ml-1" title="Verrouillé"></i></label>
          <input type="time" id="heure-cours" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2.5 text-sm text-slate-500 cursor-not-allowed outline-none font-bold" readonly />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1.5">Matière / المادة *</label>
          <input type="text" id="matiere-cours" placeholder="Ex: Mathématiques" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2.5 text-sm text-slate-800 dark:text-white outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all font-bold" required />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 dark:text-slate-400 mb-1.5">Classe / القسم *</label>
          <select id="classe-cours" onchange="chargerEleves()" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-xl px-4 py-2.5 text-sm text-slate-800 dark:text-white outline-none cursor-pointer focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all font-bold">
            <option value="">-- Sélectionner / اختر --</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Bloc Liste d'Appel -->
    <div id="zone-appel" class="hidden bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden transition-all duration-300">
      <div class="p-6 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h2 class="text-lg font-extrabold text-slate-800 dark:text-white flex items-center gap-2">
          <i class="fa-solid fa-users text-indigo-500"></i>
          <span>Liste d'appel / قائمة التلاميذ</span>
          <span id="count-eleves" class="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 px-2.5 py-1 rounded-lg ml-2 font-black shadow-inner">0</span>
        </h2>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 dark:bg-slate-900/50 text-xs font-bold uppercase text-slate-600 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700">
            <tr>
              <th class="py-3 px-4 w-12 text-center">N°</th>
              <th class="py-3 px-4 text-right" dir="rtl">الاسم واللقب / Nom & Prénom</th>
              <th class="py-3 px-4 text-center w-24 text-emerald-600 dark:text-emerald-400">Présent<br><span class="text-[10px]">حاضر</span></th>
              <th class="py-3 px-4 text-center w-24 text-rose-600 dark:text-rose-400">Absent<br><span class="text-[10px]">غائب</span></th>
              <th class="py-3 px-4 text-center w-24 text-amber-600 dark:text-amber-400">Retard<br><span class="text-[10px]">متأخر</span></th>
            </tr>
          </thead>
          <tbody id="eleves-body" class="divide-y divide-slate-100 dark:divide-slate-700">
            <!-- Rempli en Javascript -->
          </tbody>
        </table>
      </div>

      <div class="p-6 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-700 flex justify-end">
        <button type="button" id="btn-submit-appel" onclick="validerAppel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-lg shadow-emerald-600/30 transition-all flex items-center gap-2 transform active:scale-95">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Enregistrer et Transmettre à l'Administration</span>
        </button>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://eixdnxponkbsmelircjm.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable__9tG8Pj4aZ14hJxh5b-vug_DmTQb7ww';
    
    let supabaseClient = null;
    let elevesActuels = [];
    
    try {
      if (typeof supabase === 'undefined') throw new Error("Supabase non chargé");
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } catch(e) { 
      console.error(e); 
      alert("Erreur de connexion au serveur. Vérifiez votre connexion internet.");
    }

    // Gestion du Mode Sombre
    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateDarkModeIcon(isDark);
    }
    function updateDarkModeIcon(isDark) {
      const icon = document.getElementById('icon-darkmode');
      if (icon) icon.className = isDark ? 'fa-solid fa-sun text-amber-300' : 'fa-solid fa-moon text-amber-300';
    }
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      updateDarkModeIcon(true);
    } else {
      updateDarkModeIcon(false);
    }

    // Fonction de verrouillage Date/Heure
    function verrouillerDateEtHeure() {
      const dateInput = document.getElementById('date-cours');
      const heureInput = document.getElementById('heure-cours');
      
      const now = new Date();
      // Correction du fuseau horaire pour obtenir la date locale correcte
      const tzOffset = now.getTimezoneOffset() * 60000;
      const localISODate = (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
      
      dateInput.value = localISODate;

      // Arrondir l'heure à la séance la plus proche (ex: 08:15 -> 08:00)
      const hours = now.getHours().toString().padStart(2, '0');
      heureInput.value = `${hours}:00`;
    }

    // Sécurisation HTML
    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Chargement des classes au démarrage
    async function initPage() {
      verrouillerDateEtHeure();
      
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient.from('classes').select('*').order('nom_court');
        if (error) throw error;
        
        const selectClasse = document.getElementById('classe-cours');
        if (data) {
          data.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.nom_court} — ${c.nom_complet}`;
            selectClasse.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Erreur chargement classes:", err);
      }
    }

    // Chargement de la liste d'élèves
    async function chargerEleves() {
      const classeId = document.getElementById('classe-cours').value;
      const zoneAppel = document.getElementById('zone-appel');
      const tbody = document.getElementById('eleves-body');
      
      if (!classeId) {
        zoneAppel.classList.add('hidden');
        return;
      }
      
      tbody.innerHTML = `<tr><td colspan="5" class="py-12 text-center"><i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-500"></i><p class="text-sm text-slate-500 mt-3 font-bold">Chargement de la liste...</p></td></tr>`;
      zoneAppel.classList.remove('hidden');

      try {
        const { data, error } = await supabaseClient.from('eleves')
          .select('*')
          .eq('classe_id', classeId)
          .eq('actif', true)
          .order('nom');
          
        if (error) throw error;
        
        elevesActuels = data || [];
        document.getElementById('count-eleves').textContent = elevesActuels.length;
        
        afficherTableauAppel();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-rose-500 font-bold">Erreur de chargement. Veuillez réessayer.</td></tr>`;
        console.error(err);
      }
    }

    // Rendu HTML du tableau
    function afficherTableauAppel() {
      const tbody = document.getElementById('eleves-body');
      tbody.innerHTML = '';
      
      if (elevesActuels.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500 font-bold">Cette classe ne contient aucun élève actif.</td></tr>`;
        return;
      }

      elevesActuels.forEach((e, index) => {
        // NOM SECONDAIRE MASQUÉ (Suppression des doublons entre parenthèses)
        const nomSecondaire = ""; 
        
        const nomPrincipal = `${e.nom || ''} ${e.prenom || ''}`.trim();
        const alerte = e.en_alerte || e.total_absences >= 3;
        
        const tr = document.createElement('tr');
        tr.className = "animate-table-row hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors";
        
        // Logique de sélection radio (Cliquer sur la ligne coche le bouton)
        tr.innerHTML = `
          <td class="py-4 px-4 text-center font-bold text-slate-400 border-r border-slate-100 dark:border-slate-800">${index + 1}</td>
          <td class="py-4 px-4 text-right" dir="rtl">
            <div class="font-bold text-slate-800 dark:text-white text-base">${escapeHtml(nomPrincipal)}</div>
            ${nomSecondaire ? `<div class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(nomSecondaire)}</div>` : ''}
            ${alerte ? `<span class="badge-alerte-rouge bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded-full mt-1 inline-block font-bold">🚨 غياب متكرر (3 أيام)</span>` : ''}
          </td>
          <td class="py-4 px-4 text-center bg-emerald-50/30 dark:bg-emerald-900/10 cursor-pointer" onclick="document.getElementById('P_${e.id}').checked=true">
            <input type="radio" id="P_${e.id}" name="statut_${e.id}" value="P" checked class="w-5 h-5 accent-emerald-500 cursor-pointer" />
          </td>
          <td class="py-4 px-4 text-center bg-rose-50/30 dark:bg-rose-900/10 cursor-pointer" onclick="document.getElementById('A_${e.id}').checked=true">
            <input type="radio" id="A_${e.id}" name="statut_${e.id}" value="A" class="w-5 h-5 accent-rose-500 cursor-pointer" />
          </td>
          <td class="py-4 px-4 text-center bg-amber-50/30 dark:bg-amber-900/10 cursor-pointer" onclick="document.getElementById('R_${e.id}').checked=true">
            <input type="radio" id="R_${e.id}" name="statut_${e.id}" value="R" class="w-5 h-5 accent-amber-500 cursor-pointer" />
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Soumission de l'appel
    async function validerAppel() {
      const dateCours = document.getElementById('date-cours').value;
      const heureCours = document.getElementById('heure-cours').value;
      const matiere = document.getElementById('matiere-cours').value.trim();
      const classeId = document.getElementById('classe-cours').value;
      const btn = document.getElementById('btn-submit-appel');

      if (!matiere) {
        alert("Veuillez saisir la matière enseignée.");
        document.getElementById('matiere-cours').focus();
        return;
      }
      if (!classeId) return;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Enregistrement en cours...`;

      try {
        // 1. Enregistrer la séance
        const { data: seanceData, error: errSeance } = await supabaseClient
          .from('seances')
          .insert({
            date_cours: dateCours,
            heure_debut: heureCours,
            matiere: matiere,
            classe_id: classeId,
            enseignant: 'Professeur'
          })
          .select()
          .single();

        if (errSeance) throw errSeance;
        const seanceId = seanceData.id;

        // 2. Préparer les pointages
        const pointages = [];
        elevesActuels.forEach(e => {
          const radioChecked = document.querySelector(`input[name="statut_${e.id}"]:checked`);
          if (radioChecked) {
            pointages.push({
              seance_id: seanceId,
              eleve_id: e.id,
              statut: radioChecked.value,
              justifie: false,
              archive: false
            });
          }
        });

        // 3. Insérer les pointages dans la base de données
        if (pointages.length > 0) {
          const { error: errPt } = await supabaseClient.from('pointages').insert(pointages);
          if (errPt) throw errPt;
        }

        // 4. Succès
        alert("✅ L'appel a été enregistré et transmis à l'administration avec succès !");
        
        // Réinitialisation de l'interface
        document.getElementById('classe-cours').value = "";
        document.getElementById('matiere-cours').value = "";
        document.getElementById('zone-appel').classList.add('hidden');
        elevesActuels = [];

      } catch (error) {
        console.error(error);
        alert("Erreur lors de l'enregistrement de l'appel. Vérifiez votre connexion.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i><span>Enregistrer et Transmettre à l'Administration</span>`;
      }
    }

    // Lancer l'initialisation de la page
    window.addEventListener('DOMContentLoaded', initPage);

  </script>
</body>
</html>
